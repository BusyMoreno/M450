name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit Tests & Generate Reports
      working-directory: ./KN06/recipe-planner-backend
      run: mvn --batch-mode clean test

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: KN06/recipe-planner-backend/target/site/jacoco/

    - name: Upload Surefire Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: KN06/recipe-planner-backend/target/surefire-reports/
